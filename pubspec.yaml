name: alqa3a
description: "A new Flutter project."

publish_to: 'none'


version: 1.0.0+1

environment:
  sdk: ^3.9.2


dependencies:
  flutter:
    sdk: flutter
    
  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Navigation
  go_router: ^14.2.7

  # Network
  dio: ^5.7.0

  # Dependency Injection
  get_it: ^8.0.2

  # Local Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # UI
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0

  # Utils
  intl: ^0.19.0
  google_sign_in: ^7.2.0
  
  cupertino_icons: ^1.0.8
  gap: ^3.0.1
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

 
  flutter_lints: ^5.0.0


flutter:

 
  uses-material-design: true

  
  assets:
    - assets/svg/
    

 
 
  fonts:
    - family: alnaseeb
      fonts:
        - asset: assets/fonts/alnaseeb.otf
  